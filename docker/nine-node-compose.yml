  cass-nine-I:
    <<: *cassandra-base
    container_name: cass-nine-I
    hostname: cass-nine-I
    networks:
      cassandra_nine:
        ipv4_address: *ip-i
    ports: ["9342:9042"]
    volumes:
      - ./data/cass-nine-I:/var/lib/cassandra
      - ./jvm11-server.options:/etc/cassandra/jvm11-server.options
    environment:
      <<: *common-env
