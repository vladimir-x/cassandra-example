##NORHTREND
  cass-nine-H:
    <<: *cassandra-base
    container_name: cass-nine-H
    hostname: cass-nine-H
    networks:
      cassandra_nine:
        ipv4_address: *ip-h
    ports: ["9341:9042", "7399:7199"]
    volumes:
      - ./data/cass-nine-H:/var/lib/cassandra
      - ./jvm11-server.options:/etc/cassandra/jvm11-server.options
    environment:
      <<: *common-env
