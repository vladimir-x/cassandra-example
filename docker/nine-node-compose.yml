      NODE_IP: *ip-d
      CASSANDRA_DC: KALIMDOR
      CASSANDRA_RACK: KALIMDOR-RACK-D
    depends_on:
      cass-nine-C: { condition: service_healthy }
      
  cass-nine-E:
    <<: *cassandra-base
    container_name: cass-nine-E
    hostname: cass-nine-E
    networks:
      cassandra_nine:
        ipv4_address: *ip-e
    ports: ["9142:9042"]
    volumes:
      - ./data/cass-nine-E:/var/lib/cassandra
      - ./jvm11-server.options:/etc/cassandra/jvm11-server.options
    environment:
